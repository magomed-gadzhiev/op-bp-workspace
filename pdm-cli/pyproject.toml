[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdm-cli"
version = "0.13.0"
description = "CLI for managing PDM business processes via git (vibe-coding)"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "cryptography>=42",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "rich>=13.7",
    "psycopg[binary]>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "pytest-mock>=3.12",
    "paramiko>=3.4,<4.0",
    "responses>=0.25",
    "pytest-httpserver>=1.0",
]
mcp = ["mcp>=1.0.0,<2"]  # v2 переименовал FastMCP → MCPServer (ломает mcp/, sandbox_mcp/, defmcp/)

[project.scripts]
pdm = "pdm_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdm_cli"]

[tool.hatch.build.targets.wheel.force-include]
"src/pdm_cli/templates/skills" = "pdm_cli/templates/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end tests against a real PDM (skipped by default)"]
