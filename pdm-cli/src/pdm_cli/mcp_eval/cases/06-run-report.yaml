# Золотой кейс 6/8 (US5): разбор запуска — multi-hop без выдумывания ID:
# реальный instance_id агент обязан взять из list_process_instances
# (правило «не выдумывай ID»), затем один вызов bp_run_report; финальный
# ответ — по фактам отчёта (таймлайн, ошибки, «куда смотреть»).
id: run-report
title: Разбор упавшего запуска (US5)
servers: [read]
task: |
  Возьми последний запуск бизнес-процесса lem и разбери его: что
  происходило по шагам, были ли ошибки скриптов и паузы, куда смотреть
  дальше.
max_steps: 8
expect:
  tools_any: [list_process_instances, bp_run_report]
  grounding: true
