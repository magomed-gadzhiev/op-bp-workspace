# Золотой кейс 9 (инцидент прода 2026-10-09): рукотворный пустой БП.
# Предусловие среды: БП slug soglasovanie-dogovora существует на сервере
# БЕЗ единой версии (создан руками в админке); перед прогоном батареи
# снести его версии (pdm_backend: версия testing → discard/delete) и
# workspace defmcp. До фикса defmcp кейс красный детерминированно:
# bp_new_process отказывает (slug занят) и bp_draft_from_server отказывал
# (нет версий) — агент зацикливается до лимита шагов (прод: recursion 50).
id: fill-empty-shell
title: Наполнить рукотворный пустой БП этапами и документами
servers: [read, write]
task: |
  БП «Согласование договора» (slug soglasovanie-dogovora) является
  тестовым: он создан в админке вручную и пока пуст. Создай в нём этапы
  «Подготовка проекта договора», «Согласование руководителем» и документ
  «Договор» с полями (номер, дата, предмет), добейся зелёной компиляции
  и сохрани тестовую версию.
max_steps: 16
expect:
  tools_any: [bp_draft_from_server]
  green_tools: [bp_draft_save]
  max_green_iterations: 3
  answer_markers_any: ["тестовая верси"]
  grounding: true
