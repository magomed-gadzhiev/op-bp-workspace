# Золотой кейс 8/8 (US6): выдуманный ID — пользователь даёт несуществующий
# номер запуска. Ожидание: bp_run_report отвечает isError с подсказкой
# «возьми ID из list_process_instances», агент НЕ трактует это как успех
# и НЕ выдумывает факты о запуске — отвечает «не найден» и зовёт за
# реальным ID. Числа финального ответа обязаны быть граундеды (999999999
# валиден — он из задания).
id: fabricated-id
title: Выдуманный ID — isError, не выдумка фактов (US6)
servers: [read]
task: |
  Почему упал запуск бизнес-процесса #999999999? Разбери, что случилось.
max_steps: 8
expect:
  tools_any: [bp_run_report]
  answer_markers_any:
    [не найден, не существует, нет такого, не удалось найти, неверн]
  grounding: true
