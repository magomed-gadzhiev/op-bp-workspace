# Золотой кейс 5/8 (US4): узкие места БП за период — ОДИН вызов
# bp_bottlenecks_report вместо самостоятельных многоходовок по сырым
# спискам; агент аннотирует готовую справку (p50/p95/p99, падения,
# просрочки), факты — только из ответа тулза.
id: bottlenecks-report
title: Узкие места БП за период (US4)
servers: [read]
task: |
  Где буксует бизнес-процесс lem за последний месяц? Дай короткую
  справку по узким местам с цифрами.
max_steps: 6
expect:
  tools_any: [bp_bottlenecks_report]
  grounding: true
