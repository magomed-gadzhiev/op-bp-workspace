# Золотой кейс 4/8 (US3): скриптовый цикл до зелёного теста —
# bp_script_check (синтаксис) → кейс tests/<case>.yaml по живому примеру
# → bp_test в песочнице → fix → повтор. Зелёный тест — условие
# сохранения скрипта в тестовую версию (bp_draft_save, правило
# инструкции агента); бюджет итераций шире правки YAML.
id: script-green-test
title: Скрипт до зелёного теста (US3)
servers: [read, write]
task: |
  В бизнес-процессе lem проверь скрипт scripts/calc_score.py: сначала
  синтаксис и список доступных хелперов, затем напиши тест-кейс в
  tests/ по живому примеру из корпуса и добейся зелёного прогона
  bp_test. После зелёного теста сохрани изменения в тестовую версию.
# 16 шагов: полный скрипт-цикл edit→check→test-фиксы успевают (на 12
# модель кружила на граундинге и не доходила до bp_test — прод-прогон 07.10).
max_steps: 16
expect:
  tools_any: [bp_script_check]
  green_tools: [bp_test]
  max_green_iterations: 4
  grounding: true
  grounding_allow: ['300']
