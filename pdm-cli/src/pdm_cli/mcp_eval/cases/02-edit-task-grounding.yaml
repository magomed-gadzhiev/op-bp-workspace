# Золотой кейс 2/8 (US1): правка задачи с граундингом — агент не знает
# формат условия запуска и обязан взять живой образец из корпуса
# (bp_find_examples), а не угадывать поля; compile зелёный за 1–2 итерации
# (+1 запас на coordinate-фиксы).
id: edit-task-grounding
title: Правка задачи по живому образцу (US1)
servers: [read, write]
task: |
  В бизнес-процессе lem добавь в задачу «Выполнение работы» условие
  запуска: задача открывается только после завершения задачи
  «Согласование начальником ЛЭМ». Сначала найди живой пример условия
  запуска в корпусе процессов, потом правь файл задачи по образцу и
  добейся зелёной компиляции.
max_steps: 10
expect:
  tools_any: [bp_find_examples]
  green_tools: [bp_compile]
  max_green_iterations: 3
  grounding: true
